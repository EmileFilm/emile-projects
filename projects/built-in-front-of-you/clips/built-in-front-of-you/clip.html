<!-- Built in front of you. A screen unfolds out of its own button. Its word and colours are the clip's vars.
     The picture is drawn below. For a real one, put <img id="photo" hidden src="../../assets/<file>"> before the canvas. -->
<style>
  #film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .faces { position: absolute; visibility: hidden; }
  #face-1 { font-family: 'Archivo Black', sans-serif; }
</style>
<canvas id="film"></canvas>
<script type="module">
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const out = x => 1 - Math.pow(1 - clamp(x), 4)
const io = x => (x = clamp(x), x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2)
const ph = (u, a, b) => clamp((u - a) / (b - a))
const HEAVY = s => `400 ${s}px 'Archivo Black', sans-serif`
function fit(c, text, width, max, font) { c.font = font(100); const s = Math.min(max, 100 * width / Math.max(1, c.measureText(text).width)); c.font = font(s); return s }
function seeded(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
function cover(c, p, x, y, w, h, z = 1, dx = 0, dy = 0) { const s = Math.max(w / p.width, h / p.height) * z, sw = w / s, sh = h / s; c.drawImage(p, clamp((p.width - sw) / 2 + dx * sw, 0, p.width - sw), clamp((p.height - sh) / 2 + dy * sh, 0, p.height - sh), sw, sh, x, y, w, h) }

function piece(c, w, h, u, L, P) {
  c.fillStyle = L.bg; c.fillRect(0, 0, w, h)
  // Out of the button and back into it
  const open = io(ph(u, .03, .13)) * (1 - io(ph(u, .88, .985))), z = 1 + .07 * io(ph(u, .64, .78)) * (1 - io(ph(u, .86, .95)))
  const rr = (x, y, a, b, r, f) => { if (a <= 0 || b <= 0) return; c.fillStyle = f; c.beginPath(); c.roundRect(x, y, a, b, Math.min(r, a / 2, b / 2)); c.fill() }
  c.save(); c.translate(w / 2, h / 2); c.scale(z, z); c.translate(-w / 2, -h / 2)
  // Quiet shapes of the ground, always there
  for (let i = 6; i >= 1; i--) { const q = i - 1 + (u * 4) % 1, s = h * .062 * q; c.globalAlpha = Math.min(1, (6 - q) / 2.5, .2 + q); c.lineWidth = w * .02; c.strokeStyle = L.mid; c.beginPath(); c.roundRect(w * .1 - s * .62, h * .4375 - s, w * .8 + s * 1.24, h * .125 + s * 2, h * .06 + s * .5); c.stroke() } c.globalAlpha = 1
  const bw = w * .8, bh = h * (.125 - .05 * open), cw = w * .78, cH = h * .66, x0 = w / 2 - (bw + (cw - bw) * open) / 2, W = bw + (cw - bw) * open, top = h * .17, H0 = bh + (cH - bh) * open, y0 = h / 2 - bh / 2 + (top - (h / 2 - bh / 2)) * open
  c.save(); c.shadowColor = 'rgba(0,0,0,.28)'; c.shadowBlur = 70; c.shadowOffsetY = 34; rr(x0, y0, W, H0, bh / 2 + (w * .055 - bh / 2) * open, L.fg); c.restore()
  c.save(); c.beginPath(); c.roundRect(x0, y0, W, H0, bh / 2 + (w * .055 - bh / 2) * open); c.clip()
  if (open > .02) {
    const m = w * .055, X = w / 2 - cw / 2 + m, CW = cw - m * 2, a = k => out(ph(u, k, k + .12))
    const ph0 = cH * .46, pk = a(.1); c.save(); c.beginPath(); c.roundRect(X, top + m, CW, ph0, w * .03); c.clip(); rr(X, top + m, CW, ph0, 0, L.mid); cover(c, P, X, top + m + (1 - pk) * ph0, CW, ph0, 1.02 + .1 * ph(u, .1, .9), 0, -.06); c.restore()
    const Y = top + m + ph0 + m * .9
    c.globalAlpha = .9; [.62, .44].forEach((v, i) => rr(X, Y + i * h * .03, CW * v * a(.2 + i * .05), h * .016, 99, L.bg)); c.globalAlpha = .45; [.5, .56, .38].forEach((v, i) => rr(X, Y + h * .075 + i * h * .024, CW * v * a(.3 + i * .04), h * .01, 99, L.bg)); c.globalAlpha = 1
    for (let i = 0; i < 6; i++) { const v = [.4, .62, .5, .78, .7, 1][i], bb = h * .1 * v * a(.34 + i * .03); rr(X + CW * (.66 + i * .06), Y + h * .14 - bb, CW * .04, bb, 8, L.ac) }
  }
  c.restore()
  // The button itself: the one thing that is always there
  const pressed = ph(u, .7, .72) * (1 - ph(u, .75, .78)), pr = 1 - .07 * pressed, by = h / 2 + (top + cH - bh / 2 - w * .055 - h / 2) * open, bW = bw + (cw - w * .11 - bw) * open
  c.save(); c.translate(w / 2, by); c.scale(pr, pr); rr(-bW / 2, -bh / 2, bW, bh, 99, L.ac); c.fillStyle = L.word2; c.textAlign = 'center'; c.textBaseline = 'middle'; fit(c, L.word, bW * .6, bh * .54, HEAVY); c.fillText(L.word, 0, bh * .03)
  if (u > .71 && u < .86) { const k = ph(u, .71, .86); c.globalAlpha = 1 - k; c.strokeStyle = L.ac; c.lineWidth = 14 * (1 - k) + 2; c.beginPath(); c.roundRect(-bW / 2 - 70 * k, -bh / 2 - 70 * k, bW + 140 * k, bh + 140 * k, 99); c.stroke() } c.restore()
  const pk = io(ph(u, .5, .68)), go = io(ph(u, .8, .9)), q = w * .11, px = w * (1.12 - .46 * pk + .5 * go), py = by + h * .3 * (1 - pk) - q * .1
  c.fillStyle = L.fg === '#fff' ? '#000' : '#fff'; c.strokeStyle = L.fg; c.lineWidth = q * .11; c.lineJoin = 'round'; c.beginPath(); c.moveTo(px, py); c.lineTo(px + q * .82, py + q * .52); c.lineTo(px + q * .45, py + q * .62); c.lineTo(px + q * .24, py + q); c.closePath(); c.fill(); c.stroke()
  c.restore()
}

function picture(c, L, r) {
  let g = c.createRadialGradient(360, 400, 40, 360, 460, 760); g.addColorStop(0, '#ffcf87'); g.addColorStop(.3, '#e08a45'); g.addColorStop(.7, '#6f2f26'); g.addColorStop(1, '#2a1120'); c.fillStyle = g; c.fillRect(0, 0, 720, 1080)
  g = c.createLinearGradient(0, 820, 0, 1080); g.addColorStop(0, '#7a3b1d'); g.addColorStop(1, '#2d120b'); c.fillStyle = g; c.fillRect(0, 824, 720, 256)
  c.save(); c.translate(360, 850); c.scale(1, .18); g = c.createRadialGradient(0, 0, 20, 0, 0, 340); g.addColorStop(0, 'rgba(255,216,140,.9)'); g.addColorStop(1, 'rgba(255,190,110,0)'); c.fillStyle = g; c.fillRect(-360, -360, 720, 720); c.restore()
  g = c.createLinearGradient(318, 0, 402, 0); g.addColorStop(0, '#7c2410'); g.addColorStop(.35, '#ff9a5a'); g.addColorStop(1, '#5a1608'); c.fillStyle = g; c.fill(new Path2D('M330 470 C344 620 330 740 262 850 L458 850 C390 740 376 620 390 470 Z'))
  c.save(); c.shadowColor = 'rgba(255,200,110,.9)'; c.shadowBlur = 110; g = c.createRadialGradient(350, 420, 20, 360, 400, 270); g.addColorStop(0, '#fffbe8'); g.addColorStop(.4, '#ffe3a0'); g.addColorStop(.8, '#ff9f4c'); g.addColorStop(1, '#d8551e'); c.fillStyle = g; c.fill(new Path2D('M96 486 C96 300 220 196 360 196 C500 196 624 300 624 486 C560 520 160 520 96 486 Z')); c.restore()
  c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.ellipse(246, 318, 62, 24, -.8, 0, 7); c.fill()
  c.fillStyle = '#fff6d8'; c.beginPath(); c.ellipse(360, 494, 246, 17, 0, 0, 7); c.fill()
  c.fillStyle = '#1f6f68'; c.fillRect(496, 806, 180, 30); c.fillStyle = '#f2e2c4'; c.fillRect(506, 780, 164, 27); c.fillStyle = '#c2341d'; c.fillRect(488, 752, 176, 29)
  c.fillStyle = '#f7ead2'; c.beginPath(); c.roundRect(66, 756, 112, 94, 16); c.fill(); c.strokeStyle = '#f7ead2'; c.lineWidth = 14; c.beginPath(); c.arc(64, 800, 27, 1.5, 4.8); c.stroke(); g = c.createLinearGradient(66, 0, 178, 0); g.addColorStop(0, 'rgba(60,20,10,.6)'); g.addColorStop(1, 'rgba(60,20,10,0)'); c.fillStyle = g; c.beginPath(); c.roundRect(66, 756, 112, 94, 16); c.fill()
}

// A photo put in the markup is ready before the first frame
const photo = document.getElementById('photo')
if (photo) await photo.decode()

let film, c, w, h, sheet, look
export function setup(ctx) {
  film = document.getElementById('film')
  w = film.width = ctx.stage.width
  h = film.height = ctx.stage.height
  c = film.getContext('2d')
  const v = ctx.vars
  look = { word: v.word ?? 'Try it', word2: v.word2 ?? '#ffffff', bg: v.bg ?? '#cfe3ff', fg: v.fg ?? '#10224d', ac: v.ac ?? '#2f6bff', mid: v.mid ?? '#a3c4ff' }
  const drawn = document.createElement('canvas')
  drawn.width = 720
  drawn.height = 1080
  picture(drawn.getContext('2d'), look, seeded(7))
  sheet = photo ?? drawn
}
export function draw(t, ctx) {
  c.reset()
  piece(c, w, h, (t / ctx.d) % 1, look, sheet)
}
</script>
