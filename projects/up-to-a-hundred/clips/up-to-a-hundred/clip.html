<!-- Up to a hundred. A number climbs until it fills the frame. Its word and colours are the clip's vars.
     The picture is drawn below. For a real one, put <img id="photo" hidden src="../../assets/<file>"> before the canvas. -->
<style>
  #film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .faces { position: absolute; visibility: hidden; }
  #face-1 { font-family: 'Archivo Black', sans-serif; }
  #face-2 { font-family: 'Fraunces', sans-serif; }
</style>
<canvas id="film"></canvas>
<script type="module">
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const out = x => 1 - Math.pow(1 - clamp(x), 4)
const io = x => (x = clamp(x), x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2)
const ph = (u, a, b) => clamp((u - a) / (b - a))
const HEAVY = s => `400 ${s}px 'Archivo Black', sans-serif`
const SHOW = s => `italic 800 ${s}px 'Fraunces', serif`
function fit(c, text, width, max, font) { c.font = font(100); const s = Math.min(max, 100 * width / Math.max(1, c.measureText(text).width)); c.font = font(s); return s }
function seeded(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
function cover(c, p, x, y, w, h, z = 1, dx = 0, dy = 0) { const s = Math.max(w / p.width, h / p.height) * z, sw = w / s, sh = h / s; c.drawImage(p, clamp((p.width - sw) / 2 + dx * sw, 0, p.width - sw), clamp((p.height - sh) / 2 + dy * sh, 0, p.height - sh), sw, sh, x, y, w, h) }

function piece(c, w, h, u, L, P) {
  const full = io(ph(u, .46, .55)) * (1 - io(ph(u, .9, .99)))
  const fill = (1 - Math.cos(Math.PI * ph(u, .01, .42))) / 2 * (1 - io(ph(u, .9, .99)))
  c.fillStyle = L.bg; c.fillRect(0, 0, w, h); c.fillStyle = L.ac; c.fillRect(0, h * (1 - fill), w, h * fill + 1)
  // Ticks up the side, as on a gauge
  c.fillStyle = L.fg; for (let i = 0; i <= 50; i++) { const y = h * (1 - i / 50); c.globalAlpha = i % 5 ? .45 : .9; c.fillRect(0, y - 2, i % 5 ? w * .025 : w * .05, 4) } c.globalAlpha = 1
  c.textAlign = 'center'; c.textBaseline = 'middle'
  c.save(); c.translate(w * .515, h / 2); c.rotate(-Math.PI / 2); fit(c, '000', h * .86, w * .92, HEAVY); const txt = String(Math.round(100 * fill)).padStart(3, '0'), dw = c.measureText('0').width; [...txt].forEach((d, i) => c.fillText(d, (i - 1) * dw, w * .03)); c.restore()
  if (full > .001) {
    c.save(); c.beginPath(); c.rect(0, h / 2 - h / 2 * full, w, h * full); c.clip(); cover(c, P, 0, 0, w, h, 1.22 - .18 * out(ph(u, .46, .9)))
    const k = out(ph(u, .55, .63)), sh = h * .135, y = h * .635; c.beginPath(); c.rect(0, y, w * .88 * k, sh); c.clip(); c.fillStyle = L.fg; c.fillRect(0, y, w, sh); c.fillStyle = L.ac; fit(c, L.word, w * .72, sh * .74, SHOW); c.textAlign = 'left'; c.fillText(L.word, w * .08, y + sh * .5); c.restore()
  }
}

function picture(c, L, r) {
  let g = c.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, '#12052e'); g.addColorStop(.5, '#4a17a8'); g.addColorStop(1, '#0a0418'); c.fillStyle = g; c.fillRect(0, 0, 720, 1080)
  c.save(); c.globalCompositeOperation = 'screen'
  for (const [x, a, k] of [[90, .34, '120,160,255'], [230, .16, '255,120,220'], [360, 0, '255,240,200'], [490, -.16, '120,220,255'], [630, -.34, '255,130,160']]) { c.save(); c.translate(x, -30); c.rotate(-a); const q = c.createLinearGradient(0, 0, 0, 820); q.addColorStop(0, `rgba(${k},.95)`); q.addColorStop(1, `rgba(${k},0)`); c.fillStyle = q; c.beginPath(); c.moveTo(-9, 0); c.lineTo(9, 0); c.lineTo(112, 840); c.lineTo(-112, 840); c.fill(); c.restore() }
  g = c.createRadialGradient(360, 520, 10, 360, 520, 420); g.addColorStop(0, 'rgba(255,225,190,.95)'); g.addColorStop(1, 'rgba(255,120,180,0)'); c.fillStyle = g; c.fillRect(0, 100, 720, 840); c.restore()
  for (let k = 0; k < 8; k++) { const y = 560 + k * 66, s = 15 + k * 8.5, d = k / 7; const n = Math.ceil(760 / (s * 2.3)); for (let i = 0; i <= n; i++) { const x = (i + (k % 2) * .5) * s * 2.3 - 20 + (r() - .5) * s, h = y + (r() - .5) * s * .9; const rim = `rgba(255,${200 - d * 120 | 0},${190 - d * 60 | 0},${.95 - d * .55})`
    const ink = `rgb(${44 - d * 38 | 0},${14 - d * 11 | 0},${74 - d * 58 | 0})`
    if (r() > .66) { const a = -1.57 + (r() - .5) * .7, l = s * (2.4 + r()); c.strokeStyle = ink; c.lineCap = 'round'; c.lineWidth = s * .52; c.beginPath(); c.moveTo(x + s * .7, h + s); c.lineTo(x + s * .7 + Math.cos(a) * l, h + Math.sin(a) * l); c.stroke() }
    c.fillStyle = rim; c.beginPath(); c.arc(x, h - s * .12, s * .78, 0, 7); c.fill(); c.beginPath(); c.ellipse(x, h + s * 1.75, s * 1.32, s * 1.1, 0, 0, 7); c.fill()
    c.fillStyle = ink; c.beginPath(); c.arc(x, h, s * .78, 0, 7); c.fill(); c.beginPath(); c.ellipse(x, h + s * 1.9, s * 1.32, s * 1.1, 0, 0, 7); c.fill(); c.fillRect(x - s * 1.32, h + s * 1.9, s * 2.64, 90) } }
}

// A photo put in the markup is ready before the first frame
const photo = document.getElementById('photo')
if (photo) await photo.decode()

let film, c, w, h, sheet, look
export function setup(ctx) {
  film = document.getElementById('film')
  w = film.width = ctx.stage.width
  h = film.height = ctx.stage.height
  c = film.getContext('2d')
  const v = ctx.vars
  look = { word: v.word ?? 'Sold out', bg: v.bg ?? '#111018', fg: v.fg ?? '#f5f2ff', ac: v.ac ?? '#7a4dff' }
  const drawn = document.createElement('canvas')
  drawn.width = 720
  drawn.height = 1080
  picture(drawn.getContext('2d'), look, seeded(7))
  sheet = photo ?? drawn
}
export function draw(t, ctx) {
  c.reset()
  piece(c, w, h, (t / ctx.d) % 1, look, sheet)
}
</script>
