<!-- Typed bloom. A sweep types the picture over again. Its word and colours are the clip's vars.
     The picture is drawn below. For a real one, put <img id="photo" hidden src="../../assets/<file>"> before the canvas. -->
<style>
  #film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .faces { position: absolute; visibility: hidden; }
  #face-1 { font-family: 'Archivo Black', sans-serif; }
  #face-2 { font-family: 'JetBrains Mono', sans-serif; }
</style>
<canvas id="film"></canvas>
<script type="module">
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const out = x => 1 - Math.pow(1 - clamp(x), 4)
const io = x => (x = clamp(x), x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2)
const ph = (u, a, b) => clamp((u - a) / (b - a))
const TAU = Math.PI * 2
const HEAVY = s => `400 ${s}px 'Archivo Black', sans-serif`
const MONO = s => `700 ${s}px 'JetBrains Mono', monospace`
function fit(c, text, width, max, font) { c.font = font(100); const s = Math.min(max, 100 * width / Math.max(1, c.measureText(text).width)); c.font = font(s); return s }
function soft(c, blur, colour) { const k = c.getTransform().a; c.shadowColor = colour; c.shadowBlur = blur * 2 * k; c.shadowOffsetX = 5000 * k; c.translate(-5000, 0); c.fillStyle = '#000' }
function seeded(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
function cover(c, p, x, y, w, h, z = 1, dx = 0, dy = 0) { const s = Math.max(w / p.width, h / p.height) * z, sw = w / s, sh = h / s; c.drawImage(p, clamp((p.width - sw) / 2 + dx * sw, 0, p.width - sw), clamp((p.height - sh) / 2 + dy * sh, 0, p.height - sh), sw, sh, x, y, w, h) }

function piece(c, w, h, u, L, P, lum) {
  c.fillStyle = L.bg; c.fillRect(0, 0, w, h)
  const cols = 44, cw = w / cols, ch = cw * 1.5, n = Math.ceil(h / ch), set = ' .,:;-=+*oX#%@', z = 1.06 + .05 * Math.sin(TAU * u)
  c.font = MONO(cw * 1.5); c.textBaseline = 'middle'; c.textAlign = 'center'
  for (let y = 0; y < n; y++) for (let x = 0; x < cols; x++) {
    const b = lum((x / cols - .5) / z + .5, (y / n - .5) / z + .5), l = L.pale ? 1 - b : b, wob = Math.sin(x * .55) * .018 + Math.sin(x * 1.7 + 2) * .012
    const s = ((u * 2 - (y / n) * .82 - wob) % 1 + 1) % 1, hot = s < .035, fresh = s < .14
    const g = hot ? set[(x * 7 + y * 3 + Math.floor(u * 96)) % 12 + 2] : set[Math.min(13, Math.pow(l, .85) * 13.9 | 0)]
    if (g === ' ') continue
    c.fillStyle = hot ? L.ac : L.fg; c.globalAlpha = hot ? 1 : Math.min(1, (fresh ? .5 : .34) + l * .9); c.fillText(g, (x + .5) * cw, (y + .5) * ch)
  }
  c.globalAlpha = 1
  const k = out(ph(u, .3, .4)) * (1 - io(ph(u, .88, .97))), bh = h * .105, by = h * .655
  if (k > .002) { c.save(); c.beginPath(); c.rect(0, by, w * .86 * k, bh); c.clip(); c.fillStyle = L.ac; c.fillRect(0, by, w, bh); c.fillStyle = L.bg; c.textAlign = 'left'; fit(c, L.word, w * .72, bh * .74, HEAVY); c.fillText(L.word, w * .07, by + bh * .54); c.restore()
    const on = Math.floor(u * 16) % 2; if (on) { c.fillStyle = L.ac; c.fillRect(w * .86 * k + cw * .5, by, cw * 1.2, bh) } }
}

function picture(c, L, r) {
  let g = c.createRadialGradient(330, 520, 60, 360, 560, 820); g.addColorStop(0, '#f3c7a8'); g.addColorStop(.5, '#d18f6b'); g.addColorStop(1, '#4b2417')
  c.fillStyle = g; c.fillRect(0, 0, 720, 1080)
  const lid = new Path2D('M20 590 C120 330 420 260 704 520 C560 420 300 400 70 622 Z')
  c.save(); soft(c, 26, '#174fae'); c.fill(lid); c.restore()
  c.save(); soft(c, 30, 'rgba(80,28,14,.65)'); c.beginPath(); c.ellipse(360, 760, 330, 54, .06, 0, 7); c.fill(); c.shadowColor = 'rgba(255,230,205,.6)'; c.beginPath(); c.ellipse(350, 880, 300, 90, 0, 0, 7); c.fill(); c.restore()
  const alm = new Path2D('M64 610 C170 428 500 392 664 560 C590 690 280 772 64 610 Z')
  c.save(); c.clip(alm)
  g = c.createRadialGradient(370, 560, 80, 370, 580, 360); g.addColorStop(0, '#ffffff'); g.addColorStop(.6, '#e9e4e2'); g.addColorStop(1, '#8d7a78'); c.fillStyle = g; c.fillRect(0, 300, 720, 520)
  const ix = 372, iy = 562, R = 146
  g = c.createRadialGradient(ix, iy + 24, 26, ix, iy, R); g.addColorStop(0, '#ffe9a8'); g.addColorStop(.3, '#d2aa4a'); g.addColorStop(.62, '#3f9aa0'); g.addColorStop(.9, '#0f3f58'); g.addColorStop(1, '#031320'); c.fillStyle = g; c.beginPath(); c.arc(ix, iy, R, 0, 7); c.fill()
  for (let i = 0; i < 200; i++) { const a = i / 200 * 6.2832 + r() * .03, p = 54 + r() * 22, q = 92 + r() * 48; c.strokeStyle = r() > .5 ? `rgba(255,244,205,${.14 + r() * .4})` : `rgba(4,24,36,${.16 + r() * .4})`; c.lineWidth = 1.2 + r() * 2.4; c.beginPath(); c.moveTo(ix + Math.cos(a) * p, iy + Math.sin(a) * p); c.lineTo(ix + Math.cos(a + .03) * q, iy + Math.sin(a + .03) * q); c.stroke() }
  c.strokeStyle = '#020a12'; c.lineWidth = 11; c.beginPath(); c.arc(ix, iy, R - 3, 0, 7); c.stroke()
  c.fillStyle = '#020305'; c.beginPath(); c.arc(ix, iy, 60, 0, 7); c.fill()
  g = c.createLinearGradient(0, 430, 0, 590); g.addColorStop(0, 'rgba(10,4,4,.85)'); g.addColorStop(1, 'rgba(10,4,4,0)'); c.fillStyle = g; c.fillRect(0, 400, 720, 190)
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(ix - 46, iy - 52, 36, 27, -.5, 0, 7); c.fill(); c.globalAlpha = .6; c.beginPath(); c.arc(ix + 58, iy + 60, 13, 0, 7); c.fill(); c.globalAlpha = 1
  c.restore()
  c.strokeStyle = '#1a0806'; c.lineCap = 'round'; c.lineWidth = 17; c.beginPath(); c.moveTo(60, 612); c.bezierCurveTo(170, 426, 500, 390, 668, 560); c.stroke()
  c.lineWidth = 5; c.strokeStyle = 'rgba(40,12,8,.75)'; c.beginPath(); c.moveTo(80, 622); c.bezierCurveTo(280, 776, 590, 694, 664, 564); c.stroke()
  const B = (k, p) => { const m = 1 - k; return m * m * m * p[0] + 3 * m * m * k * p[1] + 3 * m * k * k * p[2] + k * k * k * p[3] }
  c.strokeStyle = '#120504'; for (let i = 0; i < 46; i++) { const k = .03 + i / 46 * .95, x = B(k, [60, 170, 500, 668]), y = B(k, [612, 426, 390, 560]), a = -2.35 + k * 1.75 + (r() - .5) * .14, l = 84 + 54 * Math.sin(k * 3.1) + r() * 22; c.lineWidth = 4 + r() * 3; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + Math.cos(a + .35) * l * .6, y + Math.sin(a + .35) * l * .6, x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke() }
  for (let i = 0; i < 26; i++) { const k = .2 + i / 26 * .72, x = B(k, [80, 280, 590, 664]), y = B(k, [622, 776, 694, 564]), a = 2.2 - k * 1.7, l = 26 + r() * 22; c.lineWidth = 2.4; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke() }
  for (let i = 0; i < 240; i++) { const k = r(), x = 40 + k * 650, y = 246 - Math.sin(k * 2.9) * 112 + (r() - .5) * 62 * (1 - k * .55) + k * 60, a = -.95 + k * 1.15 + (r() - .5) * .3, l = 40 + r() * 34; c.strokeStyle = `rgba(${40 + r() * 34 | 0},${14 + r() * 16 | 0},8,.9)`; c.lineWidth = 3.4; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke() }
}

// A photo put in the markup is ready before the first frame
const photo = document.getElementById('photo')
if (photo) await photo.decode()

let film, c, w, h, sheet, look, lum
export function setup(ctx) {
  film = document.getElementById('film')
  w = film.width = ctx.stage.width
  h = film.height = ctx.stage.height
  c = film.getContext('2d')
  const v = ctx.vars
  look = { word: v.word ?? 'SIGNAL', bg: v.bg ?? '#04130c', fg: v.fg ?? '#7dffb0', ac: v.ac ?? '#f4ff5e' }
  // On a pale ground the dark parts are inked, on a dark one the light parts
  const bright = hex => [1, 3, 5].reduce((n, i, k) => n + parseInt(hex.slice(i, i + 2), 16) * [.3, .59, .11][k], 0)
  look.pale = bright(look.bg) > bright(look.fg)
  const drawn = document.createElement('canvas')
  drawn.width = 720
  drawn.height = 1080
  picture(drawn.getContext('2d'), look, seeded(7))
  sheet = photo ?? drawn
  // How bright the picture is, once, on a small grid (its darkest and lightest stretched to 0 and 1)
  const gw = 108, gh = 162, grid = document.createElement('canvas')
  grid.width = gw
  grid.height = gh
  const g = grid.getContext('2d')
  cover(g, sheet, 0, 0, gw, gh)
  const px = g.getImageData(0, 0, gw, gh).data, light = Array.from({ length: gw * gh }, (_, i) => (px[i * 4] * .3 + px[i * 4 + 1] * .59 + px[i * 4 + 2] * .11) / 255)
  const sorted = [...light].sort((a, b) => a - b), lo = sorted[gw * gh * .02 | 0], hi = sorted[gw * gh * .98 | 0]
  // The frame is narrower than the sheet: its middle is shown
  const crop = (w / h) / (gw / gh)
  lum = (x, y) => clamp((light[clamp(y * gh | 0, 0, gh - 1) * gw + clamp((.5 + (x - .5) * crop) * gw | 0, 0, gw - 1)] - lo) / (hi - lo))
}
export function draw(t, ctx) {
  c.reset()
  piece(c, w, h, (t / ctx.d) % 1, look, sheet, lum)
}
</script>
