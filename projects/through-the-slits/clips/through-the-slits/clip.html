<!-- Through the slits. Slits open on the picture, left to right. Its word and colours are the clip's vars.
     The picture is drawn below. For a real one, put <img id="photo" hidden src="../../assets/<file>"> before the canvas. -->
<style>
  #film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .faces { position: absolute; visibility: hidden; }
  #face-1 { font-family: 'Fraunces', sans-serif; }
</style>
<canvas id="film"></canvas>
<script type="module">
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const io = x => (x = clamp(x), x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2)
const ph = (u, a, b) => clamp((u - a) / (b - a))
const TAU = Math.PI * 2
const SHOW = s => `italic 800 ${s}px 'Fraunces', serif`
function fit(c, text, width, max, font) { c.font = font(100); const s = Math.min(max, 100 * width / Math.max(1, c.measureText(text).width)); c.font = font(s); return s }
function soft(c, blur, colour) { const k = c.getTransform().a; c.shadowColor = colour; c.shadowBlur = blur * 2 * k; c.shadowOffsetX = 5000 * k; c.translate(-5000, 0); c.fillStyle = '#000' }
function seeded(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
function cover(c, p, x, y, w, h, z = 1, dx = 0, dy = 0) { const s = Math.max(w / p.width, h / p.height) * z, sw = w / s, sh = h / s; c.drawImage(p, clamp((p.width - sw) / 2 + dx * sw, 0, p.width - sw), clamp((p.height - sh) / 2 + dy * sh, 0, p.height - sh), sw, sh, x, y, w, h) }

function piece(c, w, h, u, L, P) {
  c.fillStyle = L.bg; c.fillRect(0, 0, w, h)
  const n = 9, sw = w / n
  // Never quite shut: a third of every slit stays open
  const name = io(ph(u, .3, .4)) * (1 - io(ph(u, .72, .8)))
  for (let i = 0; i < n; i++) {
    const a = io(ph(u, .03 + i * .022, .17 + i * .022)), b = io(ph(u, .76 + i * .02, .9 + i * .02)), mid = Math.abs(i - 4) <= 1
    let k = .34 + .66 * a * (1 - b); if (mid) k *= 1 - name; if (k < .004) continue
    c.save(); c.beginPath(); c.rect(i * sw + sw * (1 - k) / 2, 0, sw * k + .5, h); c.clip()
    cover(c, P, 0, 0, w, h, 1.12 + .1 * Math.sin(Math.PI * u) ** 2, 0, Math.sin(i * .8 + u * TAU) * .03); c.restore()
  }
  if (name > .002) { c.save(); c.beginPath(); for (let i = 3; i < 6; i++) { const k = 1 - .9999 * name; c.rect(i * sw, 0, sw * (1 - k) / 2 + .5, h); c.rect(i * sw + sw - sw * (1 - k) / 2 - .5, 0, sw * (1 - k) / 2 + .5, h) } c.clip(); c.translate(w / 2, h * .46); c.rotate(-Math.PI / 2); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = L.fg; const s = fit(c, L.word, h * .7, sw * 2.5, SHOW); c.fillText(L.word, (1 - name) * -h, -s * .04); c.restore()
    c.fillStyle = L.ac; c.fillRect(sw * 3 - 5, h / 2 - h / 2 * name, 10, h * name); c.fillRect(sw * 6 - 5, h / 2 - h / 2 * name, 10, h * name) }
}

function picture(c, L, r) {
  let g = c.createLinearGradient(0, 0, 0, 700); g.addColorStop(0, '#1d0620'); g.addColorStop(.6, '#8f2a1e'); g.addColorStop(1, '#ff9a4a'); c.fillStyle = g; c.fillRect(0, 0, 720, 1080)
  g = c.createRadialGradient(360, 590, 10, 360, 590, 300); g.addColorStop(0, 'rgba(255,236,190,.95)'); g.addColorStop(1, 'rgba(255,150,70,0)'); c.fillStyle = g; c.fillRect(0, 240, 720, 700)
  for (let i = 0; i < 9; i++) { const w = 46 + r() * 40, x = 180 + i * 42, h = 120 + r() * 190; c.fillStyle = `rgba(80,20,26,${.6 + r() * .3})`; c.fillRect(x, 640 - h, w, h) }
  const V = [360, 636]
  const side = (dir, floors) => { const X = dir < 0 ? 0 : 720, N = 5; for (let b = 0; b < N; b++) { const k0 = b / N, k1 = (b + 1) / N - .012, e = k => 1 - Math.pow(1 - k, 1.6), p0 = e(k0) * .86, p1 = e(k1) * .86, top = -220 + (b * 97 % 3) * 130
      const x0 = X + (V[0] - X) * p0, x1 = X + (V[0] - X) * p1, yt0 = top + (V[1] - top) * p0, yt1 = top + (V[1] - top) * p1, yb0 = 1000 + (V[1] - 1000) * p0, yb1 = 1000 + (V[1] - 1000) * p1
      const q = c.createLinearGradient(x0, 0, x1, 0); q.addColorStop(0, '#12060f'); q.addColorStop(1, '#4a1620'); c.fillStyle = q; c.beginPath(); c.moveTo(x0, yt0); c.lineTo(x1, yt1); c.lineTo(x1, yb1); c.lineTo(x0, yb0); c.fill()
      const cols = 4; for (let f = 0; f < floors; f++) for (let i = 0; i < cols; i++) { const a = (i + .18) / cols, z = (i + .8) / cols, v = (f + .2) / floors, u = (f + .74) / floors, lit = r(); const px = k => x0 + (x1 - x0) * k, py = (k, m) => { const t = yt0 + (yt1 - yt0) * k, bb = yb0 + (yb1 - yb0) * k; return t + (bb - t) * m }; c.fillStyle = lit > .56 ? `rgba(255,${180 + r() * 60 | 0},${90 + r() * 90 | 0},${.6 + r() * .4})` : lit > .5 ? L.ac : 'rgba(255,120,70,.1)'; c.beginPath(); c.moveTo(px(a), py(a, v)); c.lineTo(px(z), py(z, v)); c.lineTo(px(z), py(z, u)); c.lineTo(px(a), py(a, u)); c.fill() } } }
  g = c.createLinearGradient(0, 640, 0, 1080); g.addColorStop(0, '#ffb063'); g.addColorStop(.25, '#7a2a20'); g.addColorStop(1, '#140610'); c.fillStyle = g; c.beginPath(); c.moveTo(360, 630); c.lineTo(820, 1080); c.lineTo(-100, 1080); c.fill()
  side(-1, 13); side(1, 13)
  c.save(); c.beginPath(); c.moveTo(360, 634); c.lineTo(800, 1080); c.lineTo(-80, 1080); c.clip(); c.globalCompositeOperation = 'screen'; for (let i = 0; i < 90; i++) { const x = 30 + r() * 660, y = 690 + r() * 380, w = 3 + r() * 16, h = 20 + r() * 120; const q = c.createLinearGradient(0, y, 0, y + h); q.addColorStop(0, 'rgba(255,170,80,0)'); q.addColorStop(.5, `rgba(255,${120 + r() * 110 | 0},${60 + r() * 60 | 0},${.18 + r() * .4})`); q.addColorStop(1, 'rgba(255,170,80,0)'); c.fillStyle = q; c.fillRect(x, y, w, h) } c.restore()
  c.save(); c.shadowColor = L.ac; c.shadowBlur = 40; c.strokeStyle = L.ac; c.lineWidth = 11; c.strokeRect(62, 330, 66, 178); c.fillStyle = '#ffe9c8'; for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(95, 366 + i * 54, 17, 0, 7); c.fill() } c.restore()
  c.strokeStyle = 'rgba(16,4,10,.8)'; c.lineWidth = 3; for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(0, 210 + i * 62); c.quadraticCurveTo(360, 320 + i * 50, 720, 190 + i * 70); c.stroke() }
  c.fillStyle = '#0c0309'; c.fill(new Path2D('M356 800 C300 800 268 770 262 752 C300 716 412 716 452 752 C446 770 412 800 356 800 Z')); c.fillRect(354, 720, 5, 150); c.fill(new Path2D('M326 812 C334 786 380 786 390 812 L398 930 L374 930 L370 1012 L354 1012 L354 936 L346 1012 L330 1012 L322 930 Z')); c.beginPath(); c.arc(358, 786, 22, 0, 7); c.fill()
  c.save(); soft(c, 4, 'rgba(12,3,9,.5)'); c.fillRect(334, 1014, 56, 60); c.restore()
}

// A photo put in the markup is ready before the first frame
const photo = document.getElementById('photo')
if (photo) await photo.decode()

let film, c, w, h, sheet, look
export function setup(ctx) {
  film = document.getElementById('film')
  w = film.width = ctx.stage.width
  h = film.height = ctx.stage.height
  c = film.getContext('2d')
  const v = ctx.vars
  look = { word: v.word ?? 'After dark', bg: v.bg ?? '#160503', fg: v.fg ?? '#ffe3d0', ac: v.ac ?? '#ff5a2c' }
  const drawn = document.createElement('canvas')
  drawn.width = 720
  drawn.height = 1080
  picture(drawn.getContext('2d'), look, seeded(7))
  sheet = photo ?? drawn
}
export function draw(t, ctx) {
  c.reset()
  piece(c, w, h, (t / ctx.d) % 1, look, sheet)
}
</script>
