<!-- Running rows. Rows of one word run against each other. Its word and colours are the clip's vars.
     The picture is drawn below. For a real one, put <img id="photo" hidden src="../../assets/<file>"> before the canvas. -->
<style>
  #film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .faces { position: absolute; visibility: hidden; }
  #face-1 { font-family: 'Archivo Black', sans-serif; }
</style>
<canvas id="film"></canvas>
<script type="module">
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const out = x => 1 - Math.pow(1 - clamp(x), 4)
const io = x => (x = clamp(x), x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2)
const ph = (u, a, b) => clamp((u - a) / (b - a))
const TAU = Math.PI * 2
const HEAVY = s => `400 ${s}px 'Archivo Black', sans-serif`
function fit(c, text, width, max, font) { c.font = font(100); const s = Math.min(max, 100 * width / Math.max(1, c.measureText(text).width)); c.font = font(s); return s }
function seeded(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
function cover(c, p, x, y, w, h, z = 1, dx = 0, dy = 0) { const s = Math.max(w / p.width, h / p.height) * z, sw = w / s, sh = h / s; c.drawImage(p, clamp((p.width - sw) / 2 + dx * sw, 0, p.width - sw), clamp((p.height - sh) / 2 + dy * sh, 0, p.height - sh), sw, sh, x, y, w, h) }

function piece(c, w, h, u, L, P) {
  c.fillStyle = L.bg; c.fillRect(0, 0, w, h)
  const n = 8, rh = h / n, t = L.word.toUpperCase() + ' ', s = rh * 1.02
  c.font = HEAVY(s); c.textBaseline = 'middle'; c.lineJoin = 'round'
  const tw = c.measureText(t).width, go = 3 * u - 3 * Math.sin(2 * TAU * u) / (2 * TAU)
  for (let i = 0; i < n; i++) {
    const d = i % 2 ? 1 : -1, start = i % 2 ? -tw * .46 : w * .04
    c.fillStyle = c.strokeStyle = i % 3 === 1 ? L.ac : L.fg; c.lineWidth = w / 190
    for (let x = ((d * go * tw + start) % tw + tw) % tw - tw; x < w; x += tw) i % 2 ? c.strokeText(t, x, rh * (i + .54)) : c.fillText(t, x, rh * (i + .54))
  }
  // The picture cut in, turning as it lands
  const k = out(ph(u, .08, .2)) * (1 - io(ph(u, .44, .53)))
  if (k > .004) { const pw = w * .62, pp = pw * 1.36; c.save(); c.translate(w / 2, h / 2); c.rotate((1 - k) * .55 - .045); c.scale(k, k); c.fillStyle = L.fg; c.fillRect(-pw / 2 - 14, -pp / 2 - 14, pw + 28, pp + 28); c.beginPath(); c.rect(-pw / 2, -pp / 2, pw, pp); c.clip(); cover(c, P, -pw / 2, -pp / 2, pw, pp, 1.04 + .22 * ph(u, .08, .53)); c.restore() }
  // The word whole, on a band across the middle
  const b = io(ph(u, .53, .61)) * (1 - io(ph(u, .9, .98)))
  if (b > .002) { const bh = rh * 2.1; c.save(); c.beginPath(); c.rect(0, h / 2 - bh / 2 * b, w, bh * b); c.clip(); c.fillStyle = L.ac; c.fillRect(0, h / 2 - bh / 2, w, bh); c.fillStyle = L.bg; c.textAlign = 'center'; fit(c, L.word.toUpperCase(), w * .72, bh * .62, HEAVY); const push = 1 + .07 * ph(u, .56, .94); c.translate(w / 2, h / 2); c.scale(push, push); c.fillText(L.word.toUpperCase(), 0, bh * .03); c.restore() }
}

function picture(c, L, r) {
  let g = c.createRadialGradient(380, 420, 60, 360, 560, 760)
  g.addColorStop(0, '#4a5fd0'); g.addColorStop(.55, '#27358f'); g.addColorStop(1, '#121a4e')
  c.fillStyle = g; c.fillRect(0, 0, 720, 1080)
  g = c.createLinearGradient(0, 880, 0, 1080); g.addColorStop(0, '#1a2466'); g.addColorStop(1, '#0d133b')
  c.fillStyle = g; c.fillRect(0, 900, 720, 180)
  c.save(); c.translate(420, 948); c.scale(1, .16); g = c.createRadialGradient(0, 0, 20, 0, 0, 300); g.addColorStop(0, 'rgba(0,0,20,.8)'); g.addColorStop(1, 'rgba(0,0,20,0)'); c.fillStyle = g; c.fillRect(-320, -320, 640, 640); c.restore()
  c.save(); c.translate(360, 0); c.rotate(-.035)
  const body = new Path2D('M-196 150 L196 150 L196 184 C186 420 150 640 138 806 L-138 806 C-150 640 -186 420 -196 184 Z')
  c.save(); c.clip(body)
  const cs = [L.ac, '#fff3d2', L.bg, '#1d8f6a', '#f28ab2', L.bg, L.ac, '#fff3d2', '#1d8f6a', L.bg, '#f28ab2']
  cs.forEach((k, i) => { const a = -220 + i * 40, b = a + 41; c.fillStyle = k; c.beginPath(); c.moveTo(a, 130); c.lineTo(b, 130); c.lineTo(b * .68, 830); c.lineTo(a * .68, 830); c.fill() })
  c.fillStyle = '#f7efe0'; c.beginPath(); c.ellipse(0, 470, 128, 152, 0, 0, 7); c.fill()
  c.strokeStyle = '#17140a'; c.lineWidth = 7; c.beginPath(); c.ellipse(0, 470, 112, 136, 0, 0, 7); c.stroke()
  c.fillStyle = '#17140a'; c.beginPath(); for (let i = 0; i < 24; i++) { const a = i / 24 * 6.2832, q = i % 2 ? 34 : 76; c.lineTo(Math.cos(a) * q, 470 + Math.sin(a) * q) } c.fill()
  c.fillStyle = L.ac; c.beginPath(); c.arc(0, 470, 24, 0, 7); c.fill()
  g = c.createLinearGradient(-196, 0, 196, 0); g.addColorStop(0, 'rgba(8,8,40,.72)'); g.addColorStop(.2, 'rgba(8,8,40,.05)'); g.addColorStop(.3, 'rgba(255,255,255,.5)'); g.addColorStop(.38, 'rgba(255,255,255,0)'); g.addColorStop(.7, 'rgba(8,8,40,.06)'); g.addColorStop(1, 'rgba(8,8,40,.8)')
  c.fillStyle = g; c.fillRect(-220, 120, 440, 720)
  c.fillStyle = 'rgba(8,8,40,.28)'; c.fillRect(-220, 184, 440, 7)
  c.strokeStyle = 'rgba(8,8,40,.22)'; c.lineWidth = 2; for (let x = -190; x < 200; x += 12) { c.beginPath(); c.moveTo(x, 150); c.lineTo(x, 182); c.stroke() }
  c.restore()
  g = c.createLinearGradient(-130, 0, 130, 0); g.addColorStop(0, '#a5710a'); g.addColorStop(.25, '#ffe27a'); g.addColorStop(.6, '#f5b921'); g.addColorStop(1, '#6f4a04')
  c.fillStyle = g; c.beginPath(); c.moveTo(-132, 808); c.lineTo(132, 808); c.lineTo(120, 936); c.quadraticCurveTo(0, 956, -120, 936); c.fill()
  c.strokeStyle = 'rgba(70,40,0,.4)'; c.lineWidth = 3; for (let x = -116; x < 120; x += 13) { c.beginPath(); c.moveTo(x, 826); c.lineTo(x * .95, 938); c.stroke() }
  c.restore()
}

// A photo put in the markup is ready before the first frame
const photo = document.getElementById('photo')
if (photo) await photo.decode()

let film, c, w, h, sheet, look
export function setup(ctx) {
  film = document.getElementById('film')
  w = film.width = ctx.stage.width
  h = film.height = ctx.stage.height
  c = film.getContext('2d')
  const v = ctx.vars
  look = { word: v.word ?? 'Let\'s go', bg: v.bg ?? '#f7e34b', fg: v.fg ?? '#17140a', ac: v.ac ?? '#e8432c' }
  const drawn = document.createElement('canvas')
  drawn.width = 720
  drawn.height = 1080
  picture(drawn.getContext('2d'), look, seeded(7))
  sheet = photo ?? drawn
}
export function draw(t, ctx) {
  c.reset()
  piece(c, w, h, (t / ctx.d) % 1, look, sheet)
}
</script>
