<style>
  #ground { position: absolute; inset: 0;
    background: radial-gradient(90% 70% at 50% 46%, #2d2823 0, #181513 48%, #100f0e 100%); }
  #ember-glow { position: absolute; inset: 0;
    background: radial-gradient(circle 760px at 50% 52%, rgba(217,84,30,0.3), transparent 52%); }
  .track { position: absolute; left: 210px; width: 1500px; height: 96px; top: 514px;
    background: #1b1917; border-radius: 12px; }
  #chat-card { position: absolute; left: 310px; top: 412px; width: 1300px; height: 300px; box-sizing: border-box;
    background: #1b1917; border: 2px solid #3b352f; border-radius: 31px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
  #chat-content { position: absolute; inset: 0; }
  #chat-question { position: absolute; left: 52px; top: 42px;
    font: 500 32px/1 -apple-system, 'SF Pro Text', 'Inter', sans-serif; color: rgba(247,244,238,0.55); }
  #chat-field { position: absolute; left: 42px; right: 42px; bottom: 42px; height: 120px; box-sizing: border-box;
    background: #100f0e; border: 2px solid #3b352f; border-radius: 99px; }
  #send-button { position: absolute; right: 14px; top: 14px; width: 88px; height: 88px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, rgba(247,244,238,0.55) 0, rgba(247,244,238,0) 34%),
                radial-gradient(circle at 50% 50%, #d9541e 0, #d9541e 62%, #a83f14 100%);
    box-shadow: 0 0 36px rgba(217,84,30,0.45); }
  #send-ring { position: absolute; right: 14px; top: 14px; width: 88px; height: 88px; border-radius: 50%;
    box-sizing: border-box; border: 4px solid #d9541e; opacity: 0; }
  #caret { position: absolute; left: 404px; top: 572px; width: 4px; height: 68px; background: #f7f4ee; border-radius: 2px; }
  .word { position: absolute; display: flex; align-items: center; height: 72px; white-space: nowrap;
    font: 500 60px/1 -apple-system, 'SF Pro Text', 'Inter', sans-serif; color: #f7f4ee;
    opacity: 0; transform-origin: 50% 50%; }
  .clip { position: absolute; display: flex; align-items: center; box-sizing: border-box; height: 96px;
    padding-left: 26px; border-radius: 16px; white-space: nowrap;
    font: 600 28px/1 -apple-system, 'SF Pro Text', 'Inter', sans-serif; opacity: 0; transform-origin: 50% 50%; }
  #playhead { position: absolute; left: 0; top: 356px; width: 44px; height: 384px; margin-left: -22px;
    transform-origin: 50% 0; opacity: 0; }
  #playhead-line { position: absolute; left: 19px; top: 14px; width: 6px; bottom: 0; background: #d9541e; border-radius: 3px; }
  #playhead-head { position: absolute; left: 0; top: 0; width: 44px; height: 30px; border-radius: 99px; background: #d9541e;
    box-shadow: 0 0 20px rgba(217,84,30,0.5); }
  .hud { position: absolute; font: 600 20px/1 -apple-system, 'SF Pro Text', 'Inter', sans-serif;
    text-transform: uppercase; letter-spacing: 0.12em; color: rgba(247,244,238,0.55); }
  #hud-chapter { left: 56px; top: 56px; }
  #hud-brand { right: 56px; top: 56px; }
  #hud-product { left: 56px; bottom: 120px; }
  #hud-timecode { right: 56px; bottom: 120px; font-variant-numeric: tabular-nums; }
</style>

<div id="ground"></div>
<div id="ember-glow"></div>
<div id="track-top" class="track"></div>
<div id="track-bottom" class="track"></div>
<div id="chat-card">
  <div id="chat-content">
    <div id="chat-question">What film do you want?</div>
    <div id="chat-field">
      <div id="send-ring"></div>
      <div id="send-button"></div>
    </div>
  </div>
</div>
<div id="caret"></div>
<div id="clip-make" class="clip">Make</div>
<div id="clip-me" class="clip">me</div>
<div id="clip-a" class="clip">a</div>
<div id="clip-launch" class="clip">launch</div>
<div id="clip-film" class="clip">film</div>
<div id="word-make" class="word">Make</div>
<div id="word-me" class="word">me</div>
<div id="word-a" class="word">a</div>
<div id="word-launch" class="word">launch</div>
<div id="word-film" class="word">film</div>
<div id="playhead"><div id="playhead-line"></div><div id="playhead-head"></div></div>
<div id="hud-chapter" class="hud">02 — Ask</div>
<div id="hud-brand" class="hud">Émile</div>
<div id="hud-product" class="hud">Video editor for Mac</div>
<div id="hud-timecode" class="hud">00:03:00</div>

<script type="module">
  // The clip sits at 3 s in the film; the HUD counts the film's time, not the clip's.
  const FILM_START = 3;
  const BACK = 'cubic-bezier(.2,1.4,.3,1)';
  const EXPO = 'cubic-bezier(.16,1,.3,1)';
  const FALL = 'cubic-bezier(.55,0,1,.45)';
  const TRACK_LEFT = 210;
  // Three 96 px tracks, 20 px apart, the group centred at 52% of the frame.
  const TRACK_Y = [398, 514, 630];
  const TRACK_H = 96;
  // Slots run left to right in word order, and each sits where nothing already landed
  // lies above it, so a word drops straight down past empty track only.
  const CLIPS = [
    { track: 0, x: 24, w: 300, bg: '#f7f4ee', ink: '#100f0e' },
    { track: 1, x: 348, w: 240, bg: '#2d2823', ink: '#f7f4ee' },
    { track: 2, x: 612, w: 220, bg: '#f7f4ee', ink: '#100f0e' },
    { track: 0, x: 856, w: 320, bg: '#2d2823', ink: '#f7f4ee' },
    { track: 1, x: 1200, w: 276, bg: '#d9541e', ink: '#100f0e' },
  ];
  const HOVER_Y = 300;
  const WORD_H = 72;
  let chapter, tc, fps, b;

  export function setup(ctx) {
    fps = ctx.fps || 30;
    b = (n) => (ctx.bpm ? ctx.beat(n) : n * 0.375);
    const D = ctx.d * 1000;
    const R = ctx.root;
    const q = (s) => R.querySelector(s);
    const off = (t) => Math.min(1, Math.max(0, t * 1000 / D));
    const twoFrames = 2 / fps;
    chapter = q('#hud-chapter');
    tc = q('#hud-timecode');

    const words = [...R.querySelectorAll('.word')];
    const blocks = [...R.querySelectorAll('.clip')];
    const typeAt = [0.5, 1, 1.5, 2, 2.5].map(b);
    const landAt = [5, 5.5, 6, 6.5, 7].map(b);
    const send = b(4);
    const liftA = send - 0.07, liftB = send + 0.18;

    // Lay the typed words out in the field, as one line of text.
    const textX = 404, fieldMidY = 606, gap = 16;
    let x = textX;
    const starts = [], ends = [];
    for (const w of words) {
      const wd = Math.ceil(w.getBoundingClientRect().width);
      starts.push({ x, w: wd });
      x += wd;
      ends.push(x);
      x += gap;
    }

    // The caret steps to the end of each word as it is typed, and blinks smoothly between.
    const caret = q('#caret');
    const caretKeys = [{ offset: 0, left: textX + 'px' }];
    typeAt.forEach((tt, i) => {
      caretKeys.push({ offset: off(tt - 0.001), left: (i ? ends[i - 1] + 6 : textX) + 'px' });
      caretKeys.push({ offset: off(tt), left: (ends[i] + 8) + 'px' });
    });
    caretKeys.push({ offset: 1, left: (ends[4] + 8) + 'px' });
    caret.animate(caretKeys, { duration: D, fill: 'both' });
    caret.animate([{ opacity: 1 }, { opacity: 0.15, offset: 0.5 }, { opacity: 1 }],
      { duration: b(1) * 1000, iterations: 4, easing: 'ease-in-out', fill: 'both' });
    caret.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(0)' }],
      { delay: (send - 0.12) * 1000, duration: 120, easing: 'ease-in', fill: 'both' });

    words.forEach((w, i) => {
      const c = CLIPS[i];
      const s = starts[i];
      const L = landAt[i];
      const cx = TRACK_LEFT + c.x + c.w / 2;
      const cy = TRACK_Y[c.track] + TRACK_H / 2;
      const fallA = L - 0.15;
      const fadeA = L - twoFrames;

      // Lifting spreads the words apart over their slots, keeping their order, so none crosses another.
      const field = { left: s.x + 'px', top: (fieldMidY - WORD_H / 2) + 'px' };
      const hover = { left: (cx - s.w / 2) + 'px', top: (HOVER_Y - WORD_H / 2) + 'px' };
      const landed = { left: (cx - s.w / 2) + 'px', top: (cy - WORD_H / 2) + 'px' };
      w.animate([
        { offset: 0, ...field },
        { offset: off(liftA), ...field, easing: EXPO },
        { offset: off(liftB), ...hover },
        { offset: off(fallA), ...hover, easing: FALL },
        { offset: off(L), ...landed },
        { offset: 1, ...landed },
      ], { duration: D, fill: 'both' });
      // Appears on its half beat as it is typed; its text fades over the last two frames of the fall.
      w.animate([
        { offset: 0, opacity: 0 },
        { offset: off(typeAt[i] - 0.001), opacity: 0 },
        { offset: off(typeAt[i]), opacity: 1 },
        { offset: off(fadeA), opacity: 1 },
        { offset: off(L), opacity: 0 },
        { offset: 1, opacity: 0 },
      ], { duration: D, fill: 'both' });
      // Stretch along the fall.
      w.animate([
        { offset: 0, transform: 'scale(1,1)' },
        { offset: off(fallA), transform: 'scale(1,1)' },
        { offset: off(L), transform: 'scale(0.94,1.14)' },
        { offset: 1, transform: 'scale(0.94,1.14)' },
      ], { duration: D, fill: 'both' });

      // The block grows out of the word over those same two frames, then squashes and settles.
      const bl = blocks[i];
      Object.assign(bl.style, { left: (TRACK_LEFT + c.x) + 'px', top: TRACK_Y[c.track] + 'px', width: c.w + 'px',
        background: c.bg, color: c.ink });
      const sx = Math.min(1, s.w / c.w), sy = WORD_H / TRACK_H;
      bl.animate([
        { offset: 0, opacity: 0, transform: `scale(${sx},${sy})` },
        { offset: off(fadeA), opacity: 1, transform: `scale(${sx},${sy})`, easing: 'ease-out' },
        { offset: off(L), opacity: 1, transform: 'scale(1,1)' },
        { offset: off(L + 0.04), opacity: 1, transform: 'scale(1.03,0.9)' },
        { offset: off(L + 0.09), opacity: 1, transform: 'scale(1,1)' },
        { offset: 1, opacity: 1, transform: 'scale(1,1)' },
      ], { duration: D, fill: 'both' });
      // Hidden until it starts to grow.
      bl.animate([{ visibility: 'hidden' }, { visibility: 'visible' }],
        { delay: fadeA * 1000, duration: 1, fill: 'both' });
    });

    // Send button pulses to its peak on beat 4, a ring spreads from it.
    const half = b(4.5) - send;
    q('#send-button').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.32)', offset: 0.07 / (0.07 + half) }, { transform: 'scale(1)' }],
      { delay: (send - 0.07) * 1000, duration: (0.07 + half) * 1000, easing: 'ease-out', fill: 'both' });
    q('#send-ring').animate([{ opacity: 0.9, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(2.2)' }],
      { delay: send * 1000, duration: half * 1000, easing: EXPO, fill: 'both' });

    // The card's inside clears, then the card itself morphs into the middle track,
    // settled before the first word lands.
    q('#chat-content').animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(0.92)' }],
      { delay: (send - 0.04) * 1000, duration: 140, easing: 'ease-in', fill: 'both' });
    q('#chat-card').animate([
      { left: '310px', width: '1300px', top: '412px', height: '300px', borderRadius: '31px', borderColor: '#3b352f', boxShadow: '0 30px 80px rgba(0,0,0,0.5)' },
      { left: TRACK_LEFT + 'px', width: '1500px', top: TRACK_Y[1] + 'px', height: TRACK_H + 'px', borderRadius: '12px', borderColor: 'rgba(59,53,47,0)', boxShadow: '0 0 0 rgba(0,0,0,0)' },
    ], { delay: (send + 0.05) * 1000, duration: 260, easing: EXPO, fill: 'both' });
    // Upper and lower tracks slide out from behind it.
    q('#track-top').animate([{ top: TRACK_Y[1] + 'px' }, { top: TRACK_Y[0] + 'px' }],
      { delay: (send + 0.11) * 1000, duration: 220, easing: EXPO, fill: 'both' });
    q('#track-bottom').animate([{ top: TRACK_Y[1] + 'px' }, { top: TRACK_Y[2] + 'px' }],
      { delay: (send + 0.11) * 1000, duration: 220, easing: EXPO, fill: 'both' });

    // Playhead: drops in at the left of the timeline on beat 7.
    const ph = q('#playhead');
    const phA = b(7);
    const phX = `translateX(${TRACK_LEFT + 12}px)`;
    ph.animate([
      { offset: 0, opacity: 0, transform: `${phX} scaleY(0)` },
      { offset: off(phA - 0.07), opacity: 0, transform: `${phX} scaleY(0)`, easing: BACK },
      { offset: off(phA + 0.18), opacity: 1, transform: `${phX} scaleY(1)` },
      { offset: 1, opacity: 1, transform: `${phX} scaleY(1)` },
    ], { duration: D, fill: 'both' });
  }

  export function draw(t, ctx) {
    const label = t >= b(4) ? '03 — Build' : '02 — Ask';
    if (chapter.textContent !== label) chapter.textContent = label;
    const f = Math.floor((t + FILM_START) * fps + 1e-6);
    const ff = f % fps, ss = Math.floor(f / fps) % 60, mm = Math.floor(f / fps / 60);
    const z = (n) => String(n).padStart(2, '0');
    tc.textContent = `${z(mm)}:${z(ss)}:${z(ff)}`;
  }
</script>
