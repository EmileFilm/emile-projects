<!-- Breathing dots. Dots breathe outwards in rings. Its word and colours are the clip's vars.
     The picture is drawn below. For a real one, put <img id="photo" hidden src="../../assets/<file>"> before the canvas. -->
<style>
  #film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .faces { position: absolute; visibility: hidden; }
  #face-1 { font-family: 'Fraunces', sans-serif; }
</style>
<canvas id="film"></canvas>
<script type="module">
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const io = x => (x = clamp(x), x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2)
const ph = (u, a, b) => clamp((u - a) / (b - a))
const TAU = Math.PI * 2
const SHOW = s => `italic 800 ${s}px 'Fraunces', serif`
function fit(c, text, width, max, font) { c.font = font(100); const s = Math.min(max, 100 * width / Math.max(1, c.measureText(text).width)); c.font = font(s); return s }
function seeded(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
function cover(c, p, x, y, w, h, z = 1, dx = 0, dy = 0) { const s = Math.max(w / p.width, h / p.height) * z, sw = w / s, sh = h / s; c.drawImage(p, clamp((p.width - sw) / 2 + dx * sw, 0, p.width - sw), clamp((p.height - sh) / 2 + dy * sh, 0, p.height - sh), sw, sh, x, y, w, h) }

function piece(c, w, h, u, L, P, lum) {
  c.fillStyle = L.bg; c.fillRect(0, 0, w, h)
  const n = 40, g = w / n, m = Math.ceil(h / (g * .866)) + 2, name = io(ph(u, .3, .42)) * (1 - io(ph(u, .88, .98)))
  const z = 1.04 + .05 * Math.sin(TAU * u)
  for (let y = 0; y < m; y++) for (let x = -1; x <= n; x++) {
    const X = (x + (y % 2) * .5) * g, Y = y * g * .866, px = (X / w - .5) / z + .5, py = (Y / h - .5) / z + .5
    const s = lum(px, py), l = L.pale ? s : 1 - s, dist = Math.hypot(px - .49, (py - .4) * 1.5), wave = Math.sin(dist * 13 - u * TAU * 4)
    let r = g * .62 * Math.pow(1 - l, .8) * (.86 + .24 * wave)
    const b = ph(Y / h, .755 - .02 * wave, .8); if (name && b) r *= 1 - name * b
    if (r < g * .05) continue
    c.fillStyle = wave > .8 && l < .9 ? L.ac : L.fg; c.beginPath(); c.arc(X, Y, r, 0, 7); c.fill()
  }
  if (name > .002) { c.save(); c.beginPath(); c.rect(0, h * .79, w, h * .21); c.clip(); c.fillStyle = L.ac; c.textAlign = 'center'; c.textBaseline = 'middle'; const s = fit(c, L.word, w * .76, h * .16, SHOW); c.fillText(L.word, w / 2, h * .878 + (1 - name) * s * 1.5); c.restore() }
}

function picture(c, L, r) {
  c.fillStyle = L.pale ? '#fffaf2' : '#0a0508'; c.fillRect(0, 0, 720, 1080)
  c.strokeStyle = '#2a4a2c'; c.lineWidth = 26; c.lineCap = 'round'; c.beginPath(); c.moveTo(356, 560); c.bezierCurveTo(400, 780, 330, 900, 390, 1090); c.stroke()
  for (const [x, y, a, s] of [[372, 850, -.5, 1], [366, 930, 2.5, .9]]) { c.save(); c.translate(x, y); c.rotate(a); c.scale(s, s); const g = c.createLinearGradient(0, 0, 220, 0); g.addColorStop(0, '#173019'); g.addColorStop(1, '#8fb088'); c.fillStyle = g; c.fill(new Path2D('M0 0 C60 -80 170 -80 240 0 C170 50 60 50 0 0 Z')); c.strokeStyle = '#eaf2e2'; c.lineWidth = 4; c.beginPath(); c.moveTo(10, 0); c.lineTo(210, 0); c.stroke(); c.restore() }
  c.save(); c.translate(356, 430)
  ;[[18, 318, 92, .88], [17, 268, 84, .72], [15, 214, 74, .58], [13, 160, 62, .46], [10, 108, 48, .36], [7, 62, 34, .28]].forEach(([n, R, w, l], k) => {
    for (let i = 0; i < n; i++) { c.save(); c.rotate(i / n * 6.2832 + k * .37); const v = Math.round(l * 255), d = Math.round(l * 92); const g = c.createLinearGradient(0, 0, 0, -R); g.addColorStop(0, `rgb(${d},${d * .3 | 0},${d * .4 | 0})`); g.addColorStop(.62, `rgb(${v * .86 | 0},${v * .42 | 0},${v * .5 | 0})`); g.addColorStop(1, `rgb(${Math.min(255, v + 40)},${v * .78 | 0},${v * .8 | 0})`); c.fillStyle = g; c.strokeStyle = 'rgba(40,0,14,.62)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(-w, -R * .42, -w * .72, -R * .96, 0, -R); c.bezierCurveTo(w * .72, -R * .96, w, -R * .42, 0, 0); c.fill(); c.stroke(); c.restore() } })
  const g = c.createRadialGradient(-6, -8, 4, 0, 0, 36); g.addColorStop(0, '#fff3c0'); g.addColorStop(1, '#4a1418'); c.fillStyle = g; c.beginPath(); c.arc(0, 0, 32, 0, 7); c.fill(); c.restore()
}

// A photo put in the markup is ready before the first frame
const photo = document.getElementById('photo')
if (photo) await photo.decode()

let film, c, w, h, sheet, look, lum
export function setup(ctx) {
  film = document.getElementById('film')
  w = film.width = ctx.stage.width
  h = film.height = ctx.stage.height
  c = film.getContext('2d')
  const v = ctx.vars
  look = { word: v.word ?? 'Bloom', bg: v.bg ?? '#ffd8e4', fg: v.fg ?? '#b3123f', ac: v.ac ?? '#0f2a8a' }
  // On a pale ground the dark parts are inked, on a dark one the light parts
  const bright = hex => [1, 3, 5].reduce((n, i, k) => n + parseInt(hex.slice(i, i + 2), 16) * [.3, .59, .11][k], 0)
  look.pale = bright(look.bg) > bright(look.fg)
  const drawn = document.createElement('canvas')
  drawn.width = 720
  drawn.height = 1080
  picture(drawn.getContext('2d'), look, seeded(7))
  sheet = photo ?? drawn
  // How bright the picture is, once, on a small grid (its darkest and lightest stretched to 0 and 1)
  const gw = 108, gh = 162, grid = document.createElement('canvas')
  grid.width = gw
  grid.height = gh
  const g = grid.getContext('2d')
  cover(g, sheet, 0, 0, gw, gh)
  const px = g.getImageData(0, 0, gw, gh).data, light = Array.from({ length: gw * gh }, (_, i) => (px[i * 4] * .3 + px[i * 4 + 1] * .59 + px[i * 4 + 2] * .11) / 255)
  const sorted = [...light].sort((a, b) => a - b), lo = sorted[gw * gh * .02 | 0], hi = sorted[gw * gh * .98 | 0]
  // The frame is narrower than the sheet: its middle is shown
  const crop = (w / h) / (gw / gh)
  lum = (x, y) => clamp((light[clamp(y * gh | 0, 0, gh - 1) * gw + clamp((.5 + (x - .5) * crop) * gw | 0, 0, gw - 1)] - lo) / (hi - lo))
}
export function draw(t, ctx) {
  c.reset()
  piece(c, w, h, (t / ctx.d) % 1, look, sheet, lum)
}
</script>
